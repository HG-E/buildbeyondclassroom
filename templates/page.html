<!doctype html>
<html lang="{{lang}}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{title}}</title>
  <meta name="description" content="{{description}}">
  <meta name="robots" content="{{robots}}">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/atkinson-hyperlegible-latin-400-normal.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/styles.css">
</head>
<body{{bodyClass}}>
  <a class="skip" href="#main">{{ui.skipLink}}</a>

  {{status}}

  <header class="site">
    <div class="bar">
      <a class="brand" href="/" aria-label="{{ui.brandLabel}}">
        <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><rect x="3" y="9" width="20" height="20" rx="3" fill="none" stroke="currentColor" stroke-width="2.4"/><rect x="15" y="3" width="14" height="14" rx="3" class="brand-accent"/></svg>
        <span>{{siteName}}</span>
      </a>
      <nav class="main" aria-label="{{ui.navLabel}}">{{navLinks}}</nav>
      <a class="btn small cta-head" href="{{ctaHref}}">{{ui.ctaLabel}}</a>
      <button class="icon-btn" id="themeBtn" type="button" hidden aria-label="{{ui.themeLabel}}">{{ui.themeButton}}</button>
    </div>
  </header>

  <main id="main" tabindex="-1">
    {{content}}
  </main>

  <footer class="site">
    <div class="wrap">
      <div>
        <strong class="foot-title">{{siteName}}</strong>
        <p>{{tagline}}</p>
        <p class="lang-links">{{langLinks}}</p>
      </div>
      <div>
        <strong>{{ui.footerPagesTitle}}</strong>
        <ul>{{footerLinks}}</ul>
      </div>
      <div>
        <strong>{{ui.footerContactTitle}}</strong>
        <p>{{ui.contactLabel}} {{footerEmail}}</p>
        <p class="small">{{ui.footerNoTracking}}</p>
        <p class="small">{{ui.footerNote}}</p>
      </div>
    </div>
  </footer>

  {{data}}
  <script src="/register-sw.js" defer></script>
  <script src="/site.js" defer></script>
</body>
</html>
